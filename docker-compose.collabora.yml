name: collabora-stack

services:
  collabora:
    image: collabora/code:25.04.9.3.1
    container_name: collabora
    entrypoint:
      - /custom-start-collabora-online.sh
    restart: unless-stopped
    cap_add:
      - MKNOD
      - SYS_ADMIN
      - SYS_CHROOT
      - FOWNER
      - CHOWN
    security_opt:
      - apparmor:unconfined
      - label:disable
    environment:
      dictionaries: de_DE en_GB
      DONT_GEN_SSL_CERT: "1"
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=true
        --o:logging.disable_server_audit=true
        --o:logging.level=information
        --o:logging.level_startup=information
        --o:welcome.enable=false
        --o:mount_jail_tree=false
        --o:security.seccomp=false
        --o:remote_font_config.url=https://cloud.aiomvp.com/apps/richdocuments/settings/fonts.json
        --o:net.post_allow.host[0]=.+
      server_name: cloud.aiomvp.com
      TZ: Europe/Berlin
    networks:
      nextcloud-aio:
        aliases:
          - collabora
          - nextcloud-aio-collabora
    volumes:
      - ./collabora/start-collabora-online.sh:/custom-start-collabora-online.sh:ro

networks:
  nextcloud-aio:
    external: true
    name: nextcloud-aio
