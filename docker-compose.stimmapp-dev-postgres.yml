name: stimmapp-dev-postgres

services:
  postgres:
    image: postgres:16
    container_name: stimmapp-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stimmapp_pid_verifier
      POSTGRES_USER: stimmapp_pid_verifier
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_password
    volumes:
      - stimmapp_dev_postgres_data:/var/lib/postgresql/data
    networks:
      - stimmapp-dev-internal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U stimmapp_pid_verifier -d stimmapp_pid_verifier
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

secrets:
  postgres_password:
    file: ./secrets/pid-verifier-postgres-password

volumes:
  stimmapp_dev_postgres_data:
    external: true
    name: stimmapp_dev_postgres_data

networks:
  stimmapp-dev-internal:
    name: stimmapp-dev-internal
    internal: true
