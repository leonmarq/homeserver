background=NO
listen=YES
listen_ipv6=NO

anonymous_enable=NO
local_enable=YES
guest_enable=YES
virtual_use_local_privs=YES
write_enable=YES

pam_service_name=vsftpd_virtual
user_sub_token=$USER
local_root=/home/vsftpd/$USER

chroot_local_user=YES
allow_writeable_chroot=YES
hide_ids=YES

xferlog_enable=YES
connect_from_port_20=YES
ftp_data_port=20

seccomp_sandbox=NO

ssl_enable=YES
allow_anon_ssl=NO
force_local_logins_ssl=YES
force_local_data_ssl=YES
ssl_sslv2=NO
ssl_sslv3=NO
ssl_tlsv1=YES
ssl_tlsv1_1=YES
ssl_tlsv1_2=YES
require_ssl_reuse=NO
ssl_ciphers=HIGH
rsa_cert_file=/etc/ssl/private/ftps/ftp.crt
rsa_private_key_file=/etc/ssl/private/ftps/ftp.key
